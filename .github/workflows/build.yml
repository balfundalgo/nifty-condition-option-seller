name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: python test_patterns.py
        shell: cmd
      - run: python test_logic.py
        shell: cmd
      - run: python test_restfeed.py
        shell: cmd
      - run: python test_engine.py
        shell: cmd
      # Needs a desktop session; must never block the EXE build.
      - run: python test_gui.py
        shell: cmd
        continue-on-error: true
      - run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --name "Balfund_NIFTY_Condition_Option_Seller" ^
            --hidden-import customtkinter ^
            --hidden-import dhan ^
            --hidden-import candles ^
            --hidden-import patterns ^
            --hidden-import strategy ^
            --hidden-import restfeed ^
            --hidden-import engine ^
            --hidden-import pyotp ^
            --hidden-import websocket ^
            --hidden-import certifi ^
            --collect-all customtkinter ^
            --collect-data certifi ^
            app.py
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Balfund_NIFTY_Condition_Option_Seller_EXE
          path: dist/Balfund_NIFTY_Condition_Option_Seller.exe
          retention-days: 30
